<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MUSIC.EXE ✨ KITT3NBOT&#x27;S VAULT</title>
  <meta name="description" content="Seren&#x27;s free AI music archive. Under construction.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <!--
  ================================================================
    UNDER CONSTRUCTION SPLASH PAGE
    When the real MUSIC page is ready, replace this whole file
    with it (same filename: music.html), and the vault menu keeps working.
  ================================================================
  -->

  <style>
    :root {
      --amber: #ffb54a;
      --amber-dim: rgba(255, 181, 74, 0.55);
      --ink: #120800;
      --ar: 0.5582;                 /* background picture: 1438 x 2576 */
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { background: #000; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      color: var(--amber);
      font-family: 'VT323', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ---------- the desktop picture: always shown whole ----------
       Phones: full width. Wide screens: full height, centered. */
    .desk {
      position: relative;
      width: min(100vw, calc(100svh * var(--ar)));
      margin: 0 auto;
      aspect-ratio: var(--ar);
    }
    @supports not (height: 100svh) {
      .desk { width: min(100vw, calc(100vh * var(--ar))); }
    }
    .desk img { display: block; width: 100%; height: 100%; }
    @media (min-aspect-ratio: 3/4) {
      .desk { box-shadow: 0 0 40px rgba(180,107,255,0.25), 0 0 80px rgba(0,255,234,0.08); }
    }

    /* ---------- the DOS window ---------- */
    .dos {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + 34px);
      width: min(94vw, 500px);
      font-size: clamp(14px, 4.2vw, 22px);
      line-height: 1.1;
      background: rgba(8, 4, 2, 0.78);
      border: 2px solid var(--amber-dim);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 0 22px rgba(255,170,60,0.18), inset 0 0 26px rgba(255,170,60,0.08);
      text-shadow: 0 0 6px rgba(255,170,60,0.75);
      transform-origin: 50% 100%;
      opacity: 0;
      transform: translateX(-50%) scale(0.92) translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .dos.open { opacity: 1; transform: translateX(-50%); }
    .dos.min  { opacity: 0; transform: translateX(-50%) scale(0.6) translateY(30px); pointer-events: none; }
    .dos::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
      pointer-events: none;
    }
    .dos-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 4px 2px 8px;
      background: var(--amber);
      color: var(--ink);
      text-shadow: none;
    }
    .dos-bar span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .dos-btn {
      flex: none;
      font: inherit;
      line-height: 1;
      padding: 1px 7px 3px;
      background: var(--ink);
      color: var(--amber);
      border: 0;
      cursor: pointer;
    }
    /* 90s under-construction hazard tape, sliding slowly */
    .tape {
      height: 9px;
      background: repeating-linear-gradient(-45deg, #ffcc00 0 10px, #120800 10px 20px);
      background-size: 28.28px 100%;
      animation: tape 1.6s linear infinite;
      opacity: 0.9;
    }
    @keyframes tape { to { background-position: 28.28px 0; } }

    .dos-body { position: relative; padding: 7px 10px 9px; }
    .dos-body p { white-space: pre-wrap; word-break: break-word; }
    .sorry { color: #fff2d6; text-shadow: 0 0 6px rgba(255,190,90,0.6); margin-top: 4px; }

    .tree { list-style: none; margin: 4px 0 2px; }
    .tree li { opacity: 0; transform: translateX(-6px); transition: opacity 0.18s ease, transform 0.18s ease; }
    .tree li.on { opacity: 1; transform: none; }
    .tree a {
      display: flex;
      gap: 0.5em;
      padding: 3px 6px 4px 0;
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tree .branch { color: var(--amber-dim); white-space: pre; flex: none; }
    .tree .name { padding: 0 6px; }
    .tree .k { color: var(--amber-dim); }
    .tree a.sel .name, .tree a:focus-visible .name { background: var(--amber); color: var(--ink); text-shadow: none; }
    .tree a.sel .k, .tree a:focus-visible .k { color: var(--ink); }
    .tree a:focus-visible { outline: none; }

    .prompt { display: flex; align-items: baseline; gap: 0.4em; margin-top: 4px; }
    .prompt label { flex: none; }
    .prompt input {
      flex: 0 1 auto;
      width: 1ch;
      field-sizing: content;
      min-width: 1ch;
      max-width: 100%;
      font: inherit;
      color: inherit;
      text-shadow: inherit;
      background: transparent;
      border: 0;
      outline: none;
      caret-color: var(--amber);
      text-transform: uppercase;
    }
    .cursor, .typing-cursor { animation: blink 1s steps(1) infinite; }
    .prompt input:focus + .cursor { display: none; }
    @keyframes blink { 50% { opacity: 0; } }
    .out:empty { display: none; }
    .hint { color: var(--amber-dim); margin-top: 2px; }

    /* minimized: a glowing tag so people can see the whole desktop */
    .chip {
      position: fixed;
      z-index: 3;
      left: 16px;
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + 34px);
      font-family: 'VT323', monospace;
      font-size: clamp(20px, 5.6vw, 26px);
      padding: 5px 14px 6px;
      color: var(--amber);
      background: rgba(8,4,2,0.8);
      border: 2px solid var(--amber-dim);
      text-shadow: 0 0 6px rgba(255,170,60,0.75);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .chip.show { opacity: 1; pointer-events: auto; animation: chipGlow 1.6s ease-in-out infinite; }
    @keyframes chipGlow {
      0%, 100% { box-shadow: 0 0 6px 1px rgba(255,150,30,0.45), 0 0 14px 3px rgba(255,120,0,0.25); }
      50%      { box-shadow: 0 0 9px 2px rgba(255,160,40,0.9), 0 0 24px 6px rgba(255,120,0,0.5); }
    }

    .home {
      position: fixed;
      z-index: 2;
      left: 0; right: 0;
      bottom: max(14px, env(safe-area-inset-bottom));
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      text-shadow: 0 0 6px #000, 0 0 12px #000;
      opacity: 0.9;
    }
    .home:hover, .home:focus-visible { color: #ff69b4; outline: none; }

    /* wide screens: the window sits beside the picture instead of on top of it */
    @media (min-width: 1280px) and (min-aspect-ratio: 3/2) {
      .dos {
        --w: min(500px, calc(50vw - 100svh * 0.2791 - 56px));
        width: var(--w);
        left: calc(50% + 100svh * 0.2791 + 32px + var(--w) / 2);
        bottom: auto;
        top: 50%;
        margin-top: -190px;
        font-size: 20px;
      }
      .chip { left: calc(50% + 100svh * 0.2791 + 32px); bottom: auto; top: 50%; }
      .home { left: 24px; right: auto; top: 22px; bottom: auto; text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor, .typing-cursor, .tape { animation: none; }
      .dos, .tree li { transition: none; }
      .chip.show { animation: none; box-shadow: 0 0 8px 2px rgba(255,150,30,0.7); }
    }
  </style>
</head>
<body>
  <main class="desk">
    <img src="music-desktop.webp" width="1438" height="2576" alt="A Windows 95 desktop of Erica in an outdoor tiled bathtub under a giant blue planet, surrounded by bubbles, frutiger aero windows, ferns and cacti; the clock reads 04:20 PM">
  </main>

  <section class="dos" id="dos" aria-label="Under construction menu">
    <div class="dos-bar">
      <span>C:\VAULT\MUSIC.EXE</span>
      <button class="dos-btn" id="minBtn" type="button" aria-label="Minimize the menu to see the whole picture">_</button>
    </div>
    <div class="tape" aria-hidden="true"></div>
    <div class="dos-body">
      <p id="boot"></p>
      <p class="sorry" id="sorry" hidden>SOPHIA IS SORRY. THIS PAGE IS UNDER CONSTRUCTION. PLEASE HOLD. YOUR CALL IS VERY IMPORTANT TO US.</p>
      <ul class="tree" id="tree" hidden>
        <li><a href="vault.html"><span class="branch">├──</span><span class="name"><span class="k">[1]</span> SKIP TRACK: BACK TO THE VAULT</span></a></li>
        <li><a href="wtf.html"><span class="branch">├──</span><span class="name"><span class="k">[2]</span> SHUFFLE INTO WTF.EXE</span></a></li>
        <li><a href="index.html"><span class="branch">└──</span><span class="name"><span class="k">[3]</span> FADE OUT TO KITT3NBOT.COM</span></a></li>
      </ul>
      <p class="out" id="out" aria-live="polite"></p>
      <form class="prompt" id="prompt" hidden autocomplete="off">
        <label for="cmd">C:\VAULT\MUSIC&gt;</label>
        <input id="cmd" type="text" inputmode="text" spellcheck="false" autocapitalize="characters" aria-label="Type a command, or tap a line above">
        <span class="cursor" aria-hidden="true">▮</span>
      </form>
      <p class="hint" id="hint" hidden>TAP A LINE OR TYPE 1-3</p>
    </div>
  </section>

  <button class="chip" id="chip" type="button">▣ MUSIC.EXE</button>

  <a href="index.html" class="home">← KITT3NBOT LABS</a>

  <script>
  (function(){
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var $ = function(id){ return document.getElementById(id); };
    var dos = $('dos'), boot = $('boot'), sorry = $('sorry'), tree = $('tree'), out = $('out');
    var form = $('prompt'), input = $('cmd'), hint = $('hint'), chip = $('chip');
    var links = Array.prototype.slice.call(tree.querySelectorAll('a'));
    var LOADING = ["SKIPPING... ⏭", "SHUFFLING... 🔀", "FADING OUT..."];      // what the loading bar says for each line
    var sel = 0, busy = false, ready = false;

    function wait(ms){ return new Promise(function(r){ setTimeout(r, reduce ? 0 : ms); }); }
    function typeInto(node, text, speed){
      if (reduce){ node.data += text; return Promise.resolve(); }
      return new Promise(function(done){
        var i = 0;
        (function step(){
          node.data += text.charAt(i++);
          if (i < text.length) setTimeout(step, speed); else done();
        })();
      });
    }

    // ---- boot: types the error, apologizes, grows the menu ----
    function start(){
      dos.classList.add('open');
      var line = document.createTextNode('');
      boot.appendChild(line);
      wait(350)
        .then(function(){ return typeInto(line, "TEMPLE OS, SOPHIA v.1.8\nC:\\VAULT\\MUSIC\nMUSIC.EXE IS STILL IN THE BATH\n", 16); })
        .then(function(){ return wait(300); })
        .then(function(){ sorry.hidden = false; return wait(420); })
        .then(function(){
          tree.hidden = false;
          var p = Promise.resolve();
          tree.querySelectorAll('li').forEach(function(li){
            p = p.then(function(){ li.classList.add('on'); return wait(110); });
          });
          return p;
        })
        .then(function(){ form.hidden = false; hint.hidden = false; ready = true; select(0); });
    }
    setTimeout(start, reduce ? 0 : 400);

    function select(n){
      sel = (n + links.length) % links.length;
      links.forEach(function(a, i){ a.classList.toggle('sel', i === sel); });
    }

    function run(i){
      if (busy) return;
      select(i);
      busy = true;
      var url = links[i].getAttribute('href'), n = 0, total = 12;
      (function bar(){
        n++;
        out.textContent = LOADING[i] + '\n[' + '█'.repeat(n) + '░'.repeat(total - n) + ']';
        if (n < total) setTimeout(bar, reduce ? 0 : 45);
        else location.href = url;
      })();
    }

    links.forEach(function(a, i){
      a.addEventListener('click', function(e){
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;   // new-tab clicks work normally
        e.preventDefault();
        run(i);
      });
      a.addEventListener('mousemove', function(){ if (sel !== i) select(i); });
      a.addEventListener('focus', function(){ select(i); });
    });

    // typed commands
    var ALIASES = {
      '1': 0, 'back': 0, 'vault': 0, 'cd ..': 0, 'cd vault': 0, 'vault.html': 0, '..': 0,
      '2': 1, 'wtf': 1, 'cd wtf': 1, 'wtf.exe': 1, 'wtf.html': 1,
      '3': 2, 'home': 2, 'exit': 2, 'quit': 2, 'index': 2, 'index.html': 2, 'kitt3nbot.com': 2
    };
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var v = input.value.trim().toLowerCase().replace(/\s+/g, ' ');
      input.value = '';
      if (!v){ run(sel); return; }
      if (v in ALIASES){ run(ALIASES[v]); return; }
      if (v === 'help' || v === '?'){ out.textContent = 'TYPE 1-3, BACK, WTF OR HOME.\nOR JUST TAP A LINE.'; return; }
      if (v === 'cls' || v === 'clear'){ out.textContent = ''; return; }
      if (v === "play"){ out.textContent = "\u266a HOLD MUSIC: SMOOTH JAZZ, FOREVER."; return; }
      if (v === "420"){ out.textContent = "IT'S ALWAYS 4:20 ON THIS DESKTOP."; return; }
      if (v === "y"){ out.textContent = "YES WHAT? THE MUSIC IS STILL IN THE BATH."; return; }
      out.textContent = "BAD COMMAND OR FILE NAME: '" + v.toUpperCase() + "'";
    });

    document.addEventListener('keydown', function(e){
      if (!ready || busy || dos.classList.contains('min')) return;
      var inInput = document.activeElement === input;
      if (e.key === 'ArrowDown'){ e.preventDefault(); select(sel + 1); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); select(sel - 1); }
      else if (!inInput && /^[1-3]$/.test(e.key)) run(+e.key - 1);
      else if (!inInput && e.key === 'Enter' && !(document.activeElement && document.activeElement.tagName === 'A')) run(sel);
    });

    // ---- minimize / restore ----
    $('minBtn').addEventListener('click', function(){ dos.classList.add('min'); chip.classList.add('show'); chip.focus(); });
    chip.addEventListener('click', function(){ dos.classList.remove('min'); chip.classList.remove('show'); if (ready) links[sel].focus(); });

    // coming back with the back button: reset the loader
    window.addEventListener('pageshow', function(e){ if (e.persisted){ busy = false; out.textContent = ''; } });
  })();
  </script>
</body>
</html>
